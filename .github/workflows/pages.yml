name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never cancel each other, so the site is never left half replaced.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build web app and deploy to GitHub Pages
    runs-on: ubuntu-26.04
    # The single-codegen-unit LTO build of sql-traits is slow.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: web

      - name: Install dioxus-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # Matches the dioxus library version the web crate resolves.
          tool: dioxus-cli@0.7.10

      - name: Build web app
        working-directory: web
        run: dx build --release --platform web

      - name: Stage public artifact
        run: |
          OUT="web/target/dx/sqlippy-web/release/web/public"
          if [ ! -d "$OUT" ]; then
            echo "dx web output not found at $OUT" >&2
            find web/target -type d -name public -path '*release*' >&2 || true
            exit 1
          fi
          mkdir -p _site
          cp -r "$OUT"/. _site/
          # Must match the custom domain set under Settings > Pages.
          echo "sqlippy.luca.phd" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

      # The Pages backend intermittently answers deployment_failed, and a fresh
      # deployment after a pause almost always succeeds.
      - name: Deploy to GitHub Pages
        id: deploy-1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retrying (attempt 2)
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retrying (attempt 3)
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 3)
        id: deployment
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
